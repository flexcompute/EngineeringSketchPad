name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to create (e.g. 1.28.5)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.4.1-devel-rockylinux8
    permissions:
      contents: write
    steps:
      - name: Install system dependencies
        run: |
          yum install -y git curl make gcc gcc-c++ patch
          curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.rpm.sh | bash
          yum install -y git-lfs
          git lfs install

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Pull LFS files
        run: git lfs pull

      - name: Run download.sh
        run: bash download.sh

      - name: Run stage.sh
        run: bash stage.sh

      - name: Clean up build intermediates
        run: rm -rf ESP ESP*.tgz

      - name: Create release archive
        run: |
          tar czf ${{ github.event.repository.name }}-${{ inputs.tag }}.tar.gz \
            CMakeLists.txt README.md include lib pyESP test udc

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: ${{ github.event.repository.name }}-${{ inputs.tag }}.tar.gz
